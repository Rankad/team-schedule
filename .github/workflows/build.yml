name: Build schedule data

# Phase 0: manual trigger ONLY. No cron yet (added in Phase 3 per the
# execution plan, once the site consumes the data).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Build schedule data
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: |
          if [ -f scripts/fetch_and_build.py ]; then
            python scripts/fetch_and_build.py
          else
            echo "scripts/fetch_and_build.py not present yet (arrives in Phase 2) - skipping build."
          fi

      - name: Report fetched event count
        run: |
          if [ -f public/data/meta.json ]; then
            python -c "import json;m=json.load(open('public/data/meta.json'));print('Fetched events:', m.get('event_count'))"
          else
            echo "No meta.json produced (build entrypoint not implemented yet)."
          fi

      - name: Commit updated data (only if changed)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(data): refresh schedule data [skip ci]"
            git push
          fi
