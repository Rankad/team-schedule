name: Build & deploy

# Phase 3: twice-daily cron + manual trigger, and deploy to GitHub Pages.
#   - build-data: on schedule / manual run only. Fetches the club calendar,
#     rebuilds public/data/*.json, commits & pushes if anything changed.
#   - deploy: publishes public/ to GitHub Pages. Runs after build-data, and
#     also on a plain push that touches the site (public/**).
on:
  schedule:
    # 05:00 & 17:00 UTC ~= 07:00-08:00 and 19:00-20:00 Asia/Jerusalem
    # (a morning refresh + an evening one that catches daytime edits).
    - cron: "0 5,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/build.yml"

permissions:
  contents: write   # build-data commits the regenerated JSON
  pages: write      # deploy to Pages
  id-token: write   # OIDC token for deploy-pages

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build-data:
    # Fetch + rebuild only on the schedule or a manual run.
    # A plain push to public/** (a site edit) skips straight to deploy.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build schedule data (fetch + normalize + diff + commit)
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: python scripts/fetch_and_build.py --commit

      - name: Report fetched event count
        run: python -c "import json; m=json.load(open('public/data/meta.json')); print('Fetched events:', m['event_count'], '| window', m['window'])"

      - name: Push (no-op if fetch_and_build made no commit)
        run: git push

  deploy:
    needs: build-data
    # Deploy even when build-data was skipped (plain push) or made no commit.
    if: always() && needs.build-data.result != 'failure' && needs.build-data.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (picks up any data commit just pushed)
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload public/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
