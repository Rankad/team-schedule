name: Build schedule data

# Fetch the club calendar, rebuild public/data/*.json, commit & push if it
# changed. Deployment is handled by Cloudflare Pages' git integration (it
# deploys public/ on every push to main) — see DL-028.
# GitHub Pages is retired; the old rankad.github.io URL serves a one-off redirect
# published by .github/workflows/legacy-redirect.yml.
on:
  schedule:
    # Twice daily: a morning refresh + an evening one that catches daytime edits.
    # GitHub cron is UTC-only and can't follow Israeli DST. Anchored to WINTER
    # time (UTC+2) on purpose: 05:00/17:00 UTC = 07:00/19:00 Asia/Jerusalem
    # Nov–late March, and 08:00/20:00 during summer time. Do not "fix" to UTC+3.
    - cron: "0 5,17 * * *"
  workflow_dispatch:
  # Code pushes/PRs run only the functions-tests job below (build-data is gated
  # to schedule/dispatch by its own `if:`), so a plain push never re-fetches the
  # calendar or commits data.
  push:
    paths: ["functions/**", "public/**", "tests/**"]
  pull_request:
    paths: ["functions/**", "public/**", "tests/**"]

permissions:
  contents: write   # build-data commits the regenerated JSON

concurrency:
  group: build-data
  cancel-in-progress: false

jobs:
  build-data:
    # Only the scheduled/manual runs fetch the calendar and commit data. Plain
    # pushes and PRs skip this job and run functions-tests only.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Build schedule data (fetch + normalize + diff + commit)
        env:
          GOOGLE_CALENDAR_API_KEY: ${{ secrets.GOOGLE_CALENDAR_API_KEY }}
        run: python scripts/fetch_and_build.py --commit

      - name: Report fetched event count
        run: python -c "import json; m=json.load(open('public/data/meta.json')); print('Fetched events:', m['event_count'], '| window', m['window'])"

      - name: Push (no-op if fetch_and_build made no commit)
        run: git push

      - name: Purge past rides weeks
        continue-on-error: true
        env:
          PURGE_KEY: ${{ secrets.PURGE_KEY }}
          RIDES_API: ${{ secrets.RIDES_API }}   # e.g. https://gilboa-schedule.pages.dev
        run: |
          if [ -n "$PURGE_KEY" ] && [ -n "$RIDES_API" ]; then
            curl -fsS -X POST -H "X-Purge-Key: $PURGE_KEY" "$RIDES_API/api/purge" && echo "purge ok" || echo "purge failed (non-fatal)"
          else
            echo "PURGE_KEY / RIDES_API not set — skipping rides purge"
          fi

  functions-tests:
    # Rides Function unit tests + the static-site smoke test. Runs on every push
    # and PR (path-filtered above) and on the scheduled runs; never commits.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Functions unit tests
        run: |
          cd functions
          npm ci
          npm test
      - name: Site smoke test
        run: node tests/site_smoke.js
