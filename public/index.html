<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>הלו״ז שלי — גלבוע מעיינות</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app" hidden>
    <header class="site-header">
      <div class="wrap">
        <div class="club-name">גלבוע מעיינות</div>
        <nav class="week-nav" aria-label="ניווט שבועות">
          <button type="button" id="prev-week" class="week-arrow" aria-label="השבוע הקודם">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <span id="week-range" class="week-range" aria-live="polite">—</span>
          <button type="button" id="next-week" class="week-arrow" aria-label="השבוע הבא">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
        </nav>
      </div>
    </header>

    <main class="wrap" id="main">
      <!-- Screen 1: My Week -->
      <section id="screen-myweek" class="screen">
        <div id="onboarding" class="card onboarding" hidden>
          <!-- public/rides.js fills this with the הורה/שחקן segmented control. -->
          <div id="role-toggle-slot"></div>
          <h1>בחירת קבוצה</h1>
          <p>מצא את הקבוצה לפי שם הקבוצה או שם המאמן, ותראה כאן רק את האימונים שלה.</p>
          <button type="button" class="btn btn-primary" data-goto="addteam">＋ בחירת קבוצה</button>
        </div>

        <div id="follows-row" class="chips" hidden></div>

        <button type="button" id="share-follows" class="share-follows" hidden
                aria-label="שיתוף רשימת הקבוצות שאני עוקב אחריהן כקישור">
          🔗 שתף את הקבוצות שלי
        </button>

        <!-- Rides (public/rides.js): player mode fills rides-summary-slot with
             the weekly rides summary card / the inline name card. The
             parent/player toggle lives in #role-toggle-slot inside #onboarding. -->
        <div id="rides-summary-slot"></div>

        <div id="changes-banner" class="changes-banner" hidden>
          <button type="button" class="changes-toggle" aria-expanded="false">
            <span class="changes-summary"></span>
          </button>
          <ul class="changes-list" hidden></ul>
        </div>

        <div id="week-content"></div>

        <div id="week-actions" class="week-actions" hidden role="group" aria-label="פעולות על הלוח השבועי">
          <button type="button" id="act-copy" class="wact" aria-label="העתקת הלוח השבועי כטקסט">📋 העתק</button>
          <button type="button" id="act-share" class="wact" aria-label="שיתוף הלוח השבועי">📤 שתף</button>
          <button type="button" id="act-ics" class="wact" aria-label="הוספת הלוח השבועי ליומן (קובץ ICS)">📅 יומן</button>
          <button type="button" id="act-img" class="wact" aria-label="שמירת הלוח השבועי כתמונה">🖼️ תמונה</button>
        </div>

        <footer id="week-footer" class="week-footer" hidden>
          <div id="summary" class="summary"></div>
          <div id="updated" class="updated"></div>
        </footer>
      </section>

      <!-- Screen 2: Add Team -->
      <section id="screen-addteam" class="screen" hidden>
        <button type="button" class="btn btn-back" data-goto="myweek">→ חזרה</button>
        <h1 class="screen-title">בחירת קבוצה</h1>

        <label class="search-label" for="search">חיפוש</label>
        <input type="search" id="search" class="search-input" autocomplete="off"
               placeholder="שם קבוצה או שם מאמן…" aria-describedby="search-hint">
        <p id="search-hint" class="search-hint"></p>

        <div id="results" class="results" aria-live="polite"></div>
      </section>

      <!-- Screen 3: My Rides (player mode) — body filled by rides.js -->
      <section id="screen-rides" class="screen" hidden>
        <button type="button" class="btn btn-back" data-goto="myweek">→ חזרה</button>
        <h1 class="screen-title">ההסעות שלי</h1>
        <div id="rides-body"></div>
      </section>

      <!-- Screen 4: Privacy — body filled by rides.js -->
      <section id="screen-privacy" class="screen" hidden>
        <button type="button" class="btn btn-back" data-goto="myweek">→ חזרה</button>
        <h1 class="screen-title">מדיניות פרטיות</h1>
        <div id="privacy-body" class="prose"></div>
      </section>

      <p class="privacy-link-row">
        <button type="button" class="linklike" data-goto="privacy">מדיניות פרטיות</button>
      </p>
    </main>
  </div>

  <dialog id="rides-consent" class="sheet">
    <div class="sheet-body" id="rides-consent-body"></div>
    <div class="sheet-actions">
      <button type="button" class="btn btn-primary" data-consent="ok">הבנתי, אפשר להמשיך</button>
      <button type="button" class="btn" data-consent="cancel">ביטול</button>
    </div>
  </dialog>

  <dialog id="rides-sheet" class="sheet">
    <h2 class="sheet-heading" id="rides-sheet-heading"></h2>
    <div class="sheet-options" id="rides-sheet-options"></div>
    <div class="sheet-cancel" id="rides-sheet-cancel"></div>
    <div class="sheet-actions">
      <button type="button" class="btn" data-sheet="close">סגירה</button>
    </div>
  </dialog>

  <div id="fatal" class="fatal" hidden>
    <div class="card">
      <h1>לא הצלחנו לטעון את הנתונים</h1>
      <p>ייתכן שיש תקלה זמנית. נסו לרענן את הדף בעוד רגע.</p>
      <button type="button" class="btn btn-primary" onclick="location.reload()">רענון</button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
  <script src="rides.js"></script>
</body>
</html>
